name: quan-ly-nhan-su

services:
  api:
    container_name: quan-ly-nhan-su-api
    build:
      context: api/
      dockerfile: docker/dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-thisisapassword}@db:5432/${DATABASE_DB:-test_fastapi}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-this-secret-key-to-32-bytes-minimum}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web-network
      - api-network

  db:
    image: postgres:18-alpine
    container_name: quan-ly-nhan-su-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-thisisapassword}
      POSTGRES_DB: ${DATABASE_DB:-test_fastapi}
    volumes:
      - quan-ly-nhan-su-db-data:/var/lib/postgresql/18/data
    networks:
      - api-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_DB:-test_fastapi}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    container_name: quan-ly-nhan-su-web
    build:
      context: web/
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - web-network

volumes:
  quan-ly-nhan-su-db-data:

networks:
  web-network:
    name: web-network
    driver: bridge
  api-network:
    name: api-network
    driver: bridge
