# Dev:  docker compose up dev
# Prod: docker compose up --build web
name: next-starter

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      # Mount source để hot reload; hai volume rỗng bên dưới giữ node_modules và
      # .next của container, không để node_modules của Windows đè lên.
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Turbopack cần polling khi file đến từ bind mount (Windows/macOS).
      WATCHPACK_POLLING: "true"
    stdin_open: true
    tty: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* phải truyền lúc build, không phải lúc chạy.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://jsonplaceholder.typicode.com}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
