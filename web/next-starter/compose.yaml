# Dev:  docker compose up dev
# Prod: docker compose up --build web
name: next-starter

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      # Mount source để hot reload; hai volume rỗng bên dưới giữ node_modules và
      # .next của container, không để node_modules của Windows đè lên.
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Turbopack cần polling khi file đến từ bind mount (Windows/macOS).
      WATCHPACK_POLLING: "true"
      # Trong container, "localhost" là chính container — API nằm ở máy host.
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      # Linux không tự có host.docker.internal như Docker Desktop.
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Biến chỉ dùng phía server → đặt lúc chạy, KHÔNG cần build lại image.
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
